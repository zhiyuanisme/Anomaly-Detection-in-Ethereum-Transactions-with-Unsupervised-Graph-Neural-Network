name: CI

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-check:
    name: Lint & Environment Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the packages available without heavy native deps
          pip install numpy pandas scikit-learn networkx

      - name: Run pipeline environment check (no data files expected in CI)
        run: python pipeline.py --stage check

      - name: Syntax-check all Python source files
        run: |
          python -m py_compile pipeline.py
          python -m py_compile check_training_data.py
          python -m py_compile create_supergat_compat_files.py
          echo "All Python files parse without syntax errors."
